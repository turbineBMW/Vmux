[package]
name = "vmux"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11.3", features = ["v4_10"] }
libadwaita = { version = "0.9.1", features = ["v1_5"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# v0_78 gates the termprop APIs (install/read/changed-signal) used for
# desktop notifications; system libvte must be >= 0.78.
vte4 = { version = "0.10.0", features = ["v0_78"] }

[dev-dependencies]
tempfile = "3"
