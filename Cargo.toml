[package]
name = "vmux"
version = "0.1.0"
edition = "2024"
description = "A minimal, low-resource zoned terminal workspace for Linux (GTK4 + libadwaita + VTE)"
license = "MIT"
repository = "https://github.com/turbineBMW/Vmux"
keywords = ["terminal", "multiplexer", "gtk4", "vte"]
categories = ["command-line-utilities"]

[dependencies]
gtk4 = { version = "0.11.3", features = ["v4_10"] }
libadwaita = { version = "0.9.1", features = ["v1_6"] }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order: editing Claude Code's settings.json must not reorder it.
serde_json = { version = "1.0.150", features = ["preserve_order"] }
# v0_78 gates the termprop APIs (install/read/changed-signal) used for
# desktop notifications; system libvte must be >= 0.78.
vte4 = { version = "0.10.0", features = ["v0_78"] }

[dev-dependencies]
tempfile = "3"
