name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build · clippy · test
    runs-on: ubuntu-latest
    # vte4 with the v0_78 feature needs libvte >= 0.78 and libadwaita >= 1.6,
    # which are newer than Ubuntu's packages; build inside Arch instead.
    container: archlinux:latest
    steps:
      - name: Install toolchain and GTK stack
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita vte4 pkgconf git
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build (release)
        run: cargo build --release
